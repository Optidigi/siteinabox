# Overlay the CMS compose file when Microsoft email is configured.
# Both services share this unexposed bridge; the worker needs outbound HTTPS.
services:
  siteinabox-cms:
    environment:
      EXCHANGE_WORKER_URL: http://siteinabox-exchange-worker:8081/jobs
      EXCHANGE_WORKER_SHARED_SECRET: ${EXCHANGE_WORKER_SHARED_SECRET:?required}
    networks:
      - microsoft-mail
    depends_on:
      siteinabox-exchange-worker:
        condition: service_healthy
  siteinabox-exchange-worker:
    image: ghcr.io/optidigi/siteinabox-exchange-worker@${SIAB_EXCHANGE_WORKER_IMAGE_DIGEST:?required}
    restart: unless-stopped
    environment:
      EXCHANGE_WORKER_SHARED_SECRET: ${EXCHANGE_WORKER_SHARED_SECRET:?required}
      EXCHANGE_WORKER_LISTEN_URL: http://0.0.0.0:8081/
    networks:
      - microsoft-mail
    read_only: true
    tmpfs:
      - /tmp
      - /home/exchange-worker:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, pwsh, -NoLogo, -NoProfile, -NonInteractive, -Command, "try { $$r = Invoke-RestMethod -Uri 'http://127.0.0.1:8081/health' -Headers @{ Authorization = ('Bearer ' + $$env:EXCHANGE_WORKER_SHARED_SECRET) }; if (-not $$r.healthy) { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
networks:
  microsoft-mail: {}
