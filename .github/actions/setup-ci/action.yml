name: Setup canonical CI runtime
description: Install the governed toolchain and optional dependency and DNS prerequisites after checkout.
inputs:
  dependencies:
    description: Install frozen workspace dependencies and enable pnpm caching.
    default: "true"
  cache:
    description: Restore and save dependency inputs; false for controlled cold runs.
    default: "true"
  dns-tools:
    description: Install authoritative DNS tools in the CMS browser container.
    default: "false"
runs:
  using: composite
  steps:
    - name: Validate setup options and trust only this checkout
      shell: bash
      env:
        INSTALL_DEPENDENCIES: ${{ inputs.dependencies }}
        ENABLE_CACHE: ${{ inputs.cache }}
        INSTALL_DNS_TOOLS: ${{ inputs.dns-tools }}
      run: |
        case "$INSTALL_DEPENDENCIES:$INSTALL_DNS_TOOLS" in
          true:true|true:false|false:false) ;;
          *) echo "Unsupported CI setup options" >&2; exit 1 ;;
        esac
        case "$ENABLE_CACHE" in true|false) ;; *) exit 1 ;; esac
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.dependencies == 'true'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.dependencies == 'true' && inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
        package-manager-cache: false
    - name: Install frozen workspace dependencies
      if: inputs.dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install authoritative DNS tooling
      if: inputs.dns-tools == 'true'
      shell: bash
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends bind9-utils python3 openssl git
