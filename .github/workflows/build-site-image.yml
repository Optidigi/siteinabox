name: build-site-image

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/contracts/**"
      - "packages/legal-content/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/build-site-image.yml"
      - ".nvmrc"
      - "scripts/verify-image.mjs"
      - "docs/infrastructure-images.json"
      - "scripts/infrastructure-images.mjs"
      - "scripts/infrastructure-images.test.mjs"
      - "scripts/verify-tunnel-offline.mjs"
      - ".github/workflows/ci.yml"
      - "scripts/check-required-ci.mjs"
      - "scripts/image-evidence.mjs"
      - "scripts/image-artifact.mjs"
      - "scripts/check-publication.mjs"
      - "scripts/check-image-workflows.mjs"
      - "scripts/check-dependency-security.mjs"
      - "scripts/dependency-security-policy.mjs"
      - "scripts/collect-dependency-evidence.mjs"
      - "scripts/collect-image-dependencies.mjs"
      - "scripts/dependency-image-evidence.mjs"
      - "scripts/dependency-image-review.mjs"
      - "scripts/prepare-dependency-scanner.mjs"
      - "scripts/scan-image-dependencies.mjs"
      - "scripts/rescan-dependency-images.mjs"
      - "scripts/inventory-image-native.mjs"
      - "scripts/image-platform.mjs"
      - "docs/dependency-security.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    env:
      GH_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and smoke-test unpublished image
        id: verify
        run: pnpm image:verify site
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      - name: Retain verified image and source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-site
          path: ${{ steps.verify.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain scanner failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-diagnostics-site
          path: |
            artifacts/siab-verify-*/image-*.json
            artifacts/siab-verify-*/image-*.log
          if-no-files-found: ignore
          retention-days: 7
