name: publish-image
run-name: Publish ${{ inputs.image }} at ${{ inputs.source_sha }} from verification ${{ inputs.verification_run_id }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact image approved for publication
        required: true
        type: choice
        options: [cms, renderer, site]
      source_sha:
        description: Full reviewed main commit SHA
        required: true
        type: string
      verification_run_id:
        description: Successful main build-image workflow run containing the verified archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ghcr-publish
    permissions:
      contents: read
      actions: read
      deployments: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ inputs.image }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Validate manual request before accessing artifacts
        run: node --input-type=module -e 'import { assertPublicationRequest, publicationRequest } from "./scripts/check-publication.mjs"; assertPublicationRequest(publicationRequest())'
      - name: Download selected verification artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ inputs.image }}
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Require exact-source checks, archive and owner approval
        run: node scripts/check-publication.mjs
      - name: Log in for the explicitly approved publication
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote verified bytes without rebuilding
        run: node scripts/publish-image.mjs
      - name: Retain immutable publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-${{ inputs.image }}
          path: artifacts/published-*.json
          if-no-files-found: error
          retention-days: 90
