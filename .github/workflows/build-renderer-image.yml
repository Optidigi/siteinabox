name: build-renderer-image

on:
  pull_request:
    paths:
      - "apps/renderer/**"
      - "packages/contracts/**"
      - "packages/legal-content/**"
      - "packages/site-renderer/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/build-renderer-image.yml"
      - ".nvmrc"
      - "scripts/verify-image.mjs"
      - ".github/workflows/ci.yml"
      - "scripts/check-required-ci.mjs"
      - "scripts/image-evidence.mjs"
      - "scripts/image-artifact.mjs"
      - "scripts/check-publication.mjs"
      - "scripts/check-image-workflows.mjs"
  push:
    branches: [main]
    paths:
      - "apps/renderer/**"
      - "packages/contracts/**"
      - "packages/legal-content/**"
      - "packages/site-renderer/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/build-renderer-image.yml"
      - ".nvmrc"
      - "scripts/verify-image.mjs"
      - ".github/workflows/ci.yml"
      - "scripts/check-required-ci.mjs"
      - "scripts/image-evidence.mjs"
      - "scripts/image-artifact.mjs"
      - "scripts/check-publication.mjs"
      - "scripts/check-image-workflows.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-renderer-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and smoke-test unpublished image
        id: verify
        run: pnpm image:verify renderer
      - name: Retain verified image and source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-renderer
          path: ${{ steps.verify.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
