name: ci-disposable-control-proof

on:
  pull_request:
    branches: [control-proof/pr01-20261007-target]

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Intentionally fail an Actions-source required check
        run: exit 1

  cms-quality:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disposable control fixture only; no application verification is claimed"

  cms-test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disposable control fixture only; no application verification is claimed"

  site:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disposable control fixture only; no application verification is claimed"

  renderer:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disposable control fixture only; no application verification is claimed"

  required-ci:
    if: ${{ always() }}
    needs: [package-quality, cms-quality, cms-test, site, renderer]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Fail closed when the intentional required dependency fails
        run: printf '%s' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
