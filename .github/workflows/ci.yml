name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache-mode:
        description: Controlled cache comparison; all qualification still executes.
        type: choice
        options: [normal, cold]
        default: normal

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package-quality:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TYPE_SAFETY_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache: ${{ inputs.cache-mode != 'cold' }}
      - name: Static deployment parity
        run: pnpm deployment:static-parity
      - name: Repository configuration contracts
        run: |
          pnpm mcp:check
          pnpm docs:check
          pnpm type-safety:check
          pnpm check:toolchain
          pnpm environment:check
          pnpm workflow:check
          pnpm workflow:actions:check
          pnpm infrastructure:check
          pnpm publication:check
          pnpm dependency:policy:test
          pnpm cms:test:guard
          pnpm ci:policy:check
          node --test apps/cms/tests/unit/posthog-settings-privacy.test.mjs
      - name: Review current full and production dependency evidence
        run: pnpm dependency:check
      - name: Retain source advisory evidence and blocked-readiness diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-source-evidence
          path: |
            artifacts/dependency-source.json
            artifacts/dependency-readiness.json
          if-no-files-found: error
          retention-days: 7
      - name: Shared package type checks
        run: pnpm packages:typecheck
      - name: Contract and renderer tests
        run: |
          pnpm --dir packages/contracts test
          pnpm --dir packages/site-renderer test
      - name: Legal release integrity
        run: |
          pnpm legal:check
          pnpm --dir packages/legal-content test

  cms-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          cache: ${{ inputs.cache-mode != 'cold' }}
      - name: Validate complete CMS test inventory
        run: node scripts/check-cms-test-plan.mjs
      - name: Responsive canvas contract
        run: pnpm --dir apps/cms check:responsive
      - name: Frontend boundary contract
        run: pnpm --dir apps/cms lint:ui-boundary
      - name: Frontend composition contract
        run: pnpm --dir apps/cms lint:ui-composition
      - name: Lint (no-css)
        run: pnpm --dir apps/cms lint:no-css

      - name: Generate Payload types
        run: |
          pnpm --dir apps/cms payload generate:types
          pnpm --dir apps/cms payload generate:importmap
        env:
          PAYLOAD_SECRET: ci-placeholder
          DATABASE_URI: postgres://placeholder@placeholder/placeholder
      - name: Payload dependency contract
        run: pnpm --dir apps/cms payload:contract
      - name: Rich-text dependency compatibility
        run: node --test apps/cms/tests/contract/richtext-dom.test.mjs
      - name: Type check
        run: pnpm --dir apps/cms typecheck

  cms-tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        part: [unit-1, unit-2, integration-1, integration-2]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PAYLOAD_SECRET: siab-test-ci-synthetic-secret
      DATABASE_URI: postgres://payload:ci-password@postgres:5432/payload_test
      PAYLOAD_DISABLE_JOBS_AUTORUN: "1"
      SITE_GENERATION_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dns-tools: "true"
          cache: ${{ inputs.cache-mode != 'cold' }}
      - name: Verify pinned browser and DNS runtime
        run: node scripts/check-browser-runtime.mjs cms --dns
      - name: Authorize only this job's fresh PostgreSQL resource
        run: |
          node scripts/authorize-cms-test-resource.mjs --create-database "$RUNNER_TEMP/siab-test-cms"
          echo "SIAB_TEST_RESOURCE_FILE=$RUNNER_TEMP/siab-test-cms/resource.json" >> "$GITHUB_ENV"
      - name: Restore V8 compile intermediates
        if: inputs.cache-mode != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/siab-ci-v8
          key: ${{ runner.os }}-${{ runner.arch }}-v8-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ matrix.part }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-v8-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}-${{ matrix.part }}-
      - name: Generate Payload types
        run: pnpm --dir apps/cms payload generate:types
      - name: Early commerce failure rehearsals
        if: matrix.part == 'unit-1'
        run: pnpm --dir apps/cms check:commerce-release
      - name: Execute complete isolated CMS test partition
        run: node scripts/run-cms-tests.mjs ${{ matrix.part }}
        env:
          NODE_COMPILE_CACHE: /tmp/siab-ci-v8
      - name: Verify checkout browser contract
        if: matrix.part == 'unit-1'
        run: pnpm --dir apps/cms test:checkout-browser
      - name: Retain partition evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cms-test-${{ matrix.part }}
          path: artifacts/cms-tests/${{ matrix.part }}/
          if-no-files-found: error
          retention-days: 7

  cms-test:
    if: ${{ always() }}
    needs: [cms-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dependencies: "false"
      - name: Require every test partition to succeed
        env:
          PARTITION_RESULT: ${{ needs.cms-tests.result }}
        run: test "$PARTITION_RESULT" = success
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cms-test-*
          path: artifacts/cms-tests
      - name: Verify complete exact-source partition coverage
        run: node scripts/check-cms-test-results.mjs

  cms-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PAYLOAD_SECRET: siab-test-ci-synthetic-secret
      DATABASE_URI: postgres://payload:ci-password@postgres:5432/payload_test
      PAYLOAD_DISABLE_JOBS_AUTORUN: "1"
      SITE_GENERATION_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dns-tools: "true"
          cache: ${{ inputs.cache-mode != 'cold' }}
      - name: Authorize only the fresh CI PostgreSQL resource
        run: |
          node scripts/authorize-cms-test-resource.mjs --create-database "$RUNNER_TEMP/siab-test-cms"
          echo "SIAB_TEST_RESOURCE_FILE=$RUNNER_TEMP/siab-test-cms/resource.json" >> "$GITHUB_ENV"
      - name: Verify pinned browser runtime
        run: node scripts/check-browser-runtime.mjs cms --dns
      - name: Generate Payload types
        run: |
          pnpm --dir apps/cms payload generate:types
      - name: Restore Next compiler intermediates
        if: inputs.cache-mode != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/cms/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/cms/next.config.mjs', 'apps/cms/tsconfig.build.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-next-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'apps/cms/next.config.mjs', 'apps/cms/tsconfig.build.json') }}-
      - name: Verify actual built invitation action boundaries
        run: pnpm --dir apps/cms test:invitation-actions
      - name: Retain built invitation action evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invitation-action-evidence
          path: apps/cms/test-results/invitation-actions.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify real built CMS sessions, persistence and rendering
        run: pnpm --dir apps/cms test:built-browser --reuse-built
      - name: Retain redacted built application journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-application-browser-evidence
          path: apps/cms/test-results/built-browser-*/
          if-no-files-found: error
          retention-days: 7

  site:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          cache: ${{ inputs.cache-mode != 'cold' }}
      - run: pnpm landing:build
      - run: pnpm landing:test
      - name: Verify pinned browser runtime
        run: node scripts/check-browser-runtime.mjs landing
      - name: Verify landing UI, responsive, and accessibility contracts
        env:
          SIAB_REUSE_LANDING_BUILD: "1"
        run: pnpm --dir apps/landing test:ui
      - name: Verify landing analytics consent lifecycle
        run: pnpm --dir apps/landing test:analytics-browser
      - name: Upload landing browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: landing-browser-test-diagnostics
          path: apps/landing/test-results/
          if-no-files-found: ignore
          retention-days: 7

  renderer:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          cache: ${{ inputs.cache-mode != 'cold' }}
      - run: pnpm renderer:deploy-contract
      - run: pnpm renderer:typecheck
      - run: pnpm renderer:test
      - run: pnpm renderer:build
      - name: Verify pinned browser runtime
        run: node scripts/check-browser-runtime.mjs renderer
      - name: Verify analytics lifecycle ownership
        run: pnpm --dir apps/renderer test:analytics-browser

  image-verification:
    needs: [package-quality]
    env:
      GH_TOKEN: ${{ github.token }}
      SIAB_IMAGE_BUILD_CACHE: ${{ inputs.cache-mode != 'cold' && '1' || '0' }}
      POSTHOG_PROJECT_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.POSTHOG_PROJECT_TOKEN || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [cms, renderer, site]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache: ${{ inputs.cache-mode != 'cold' }}
      - name: Download current-run reviewed scanner publisher evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-source-evidence
          path: artifacts/dependency-source
      - name: Restore local BuildKit compiler layers
        if: inputs.cache-mode != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/buildkit-cache/${{ matrix.app }}
          key: ${{ runner.os }}-${{ runner.arch }}-buildkit-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/Dockerfile', '.dockerignore') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-buildkit-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/Dockerfile', '.dockerignore') }}-
      - name: Restore verified scanner inputs and fresh-checkable advisory database
        if: inputs.cache-mode != 'cold'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/dependency-tools
          key: ${{ runner.os }}-${{ runner.arch }}-scanner-${{ hashFiles('scripts/prepare-dependency-scanner.mjs', 'scripts/dependency-image-evidence.mjs') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-scanner-${{ hashFiles('scripts/prepare-dependency-scanner.mjs', 'scripts/dependency-image-evidence.mjs') }}-
      - name: Build and smoke the actual packaged image without publication
        id: verify
        run: pnpm image:verify ${{ matrix.app }}
      - name: Retain exact-source smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-${{ matrix.app }}
          path: ${{ steps.verify.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain trusted main verified archives for later approved promotion
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.app }}
          path: ${{ steps.verify.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain trusted main owned PostgreSQL archive
        if: matrix.app == 'cms' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-postgres
          path: ${{ steps.verify.outputs.postgres-artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain trusted main owned cloudflared archive
        if: matrix.app == 'cms' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-cloudflared
          path: ${{ steps.verify.outputs.cloudflared-artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain scanner failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-dependency-diagnostics-${{ matrix.app }}
          path: |
            artifacts/siab-verify-*/image-*.json
            artifacts/siab-verify-*/image-*.log
          if-no-files-found: ignore
          retention-days: 7

  exchange-worker:
    needs: [package-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dependencies: "false"
      - name: Download current-run reviewed scanner publisher evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-source-evidence
          path: artifacts/dependency-source
      - name: Build and test the actual private Exchange worker
        id: verify
        run: node scripts/verify-exchange-worker.mjs
      - name: Retain worker proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-exchange-worker
          path: |
            ${{ steps.verify.outputs.artifact-path || 'artifacts/no-worker-evidence' }}/image-*.json
            ${{ steps.verify.outputs.artifact-path || 'artifacts/no-worker-evidence' }}/*.log
            ${{ steps.verify.outputs.artifact-path || 'artifacts/no-worker-evidence' }}/worker-runtime-inventory.json
            ${{ steps.verify.outputs.artifact-path || 'artifacts/no-worker-evidence' }}/worker-dpkg-inventory.txt
          if-no-files-found: error
          retention-days: 7
      - name: Retain trusted main worker archive for separate qualification
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-exchange-worker
          path: ${{ steps.verify.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  image-security:
    needs: [package-quality, image-verification, exchange-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dependencies: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-image-*
          merge-multiple: true
          path: artifacts/ci-images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-source-evidence
          path: artifacts/dependency-source
      - name: Surface exact-image advisory failures before browser completion
        run: node scripts/check-dependency-security.mjs --source-evidence artifacts/dependency-source/dependency-source.json --images artifacts/ci-images

  required-ci:
    if: ${{ always() }}
    needs: [package-quality, cms-quality, cms-tests, cms-test, cms-browser, site, renderer, image-verification, image-security, exchange-worker]
    runs-on: ubuntu-latest
    env:
      CI_JOB_RESULTS: ${{ toJSON(needs) }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ci
        with:
          dependencies: "false"
      - name: Read installed delivery controls without administrative writes
        run: node scripts/inspect-delivery-controls.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download this run's packaged-image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-image-*
          merge-multiple: true
          path: artifacts/ci-images
      - name: Download this run's source dependency evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-source-evidence
          path: artifacts/dependency-source
      - name: Download current-run CMS partition receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cms-test-*
          path: artifacts/cms-tests
      - run: node scripts/check-required-ci.mjs
      - name: Retain CI results and honest control diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-ci-evidence
          path: |
            artifacts/required-ci.json
            artifacts/delivery-control-readback.json
            artifacts/dependency-readiness.json
          if-no-files-found: error
          retention-days: 7
