# Production compose for the generic SiteInABox renderer and its private
# outbound-only Cloudflare Tunnel connector.
# Deploy path on VPS: /srv/saas/infra/stacks/siteinabox/apps/renderer/compose.yml
name: siteinabox-renderer

services:
  siteinabox-renderer:
    image: ghcr.io/optidigi/siteinabox-renderer@${SIAB_RENDERER_IMAGE_DIGEST:?required}
    pull_policy: always
    container_name: siteinabox-renderer
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"
      SIAB_CMS_URL: ${SIAB_CMS_URL}
      SIAB_RENDERER_API_TOKEN_FILE: /run/secrets/renderer_api_token
      SIAB_RENDERER_ORIGIN_TRUST_MODE: cloudflare_tunnel
      SITE_URL: ${SITE_URL}
      SIAB_RENDERER_FIXTURE_MODE: ${SIAB_RENDERER_FIXTURE_MODE:-}
      DATA_DIR: /data-out
    secrets: [renderer_api_token]
    volumes:
      - ${DATA_HOST_PATH:-/srv/data/saas/siab-payload}:/data-out:ro
    expose: ["4321"]
    networks: [renderer-origin]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/healthz"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  siteinabox-renderer-tunnel:
    image: docker.io/cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    pull_policy: always
    container_name: siteinabox-renderer-tunnel
    restart: unless-stopped
    user: "1000:1000"
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      siteinabox-renderer:
        condition: service_healthy
    secrets: [cloudflare_tunnel_token]
    networks: [renderer-origin]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      start_period: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  renderer-origin:
    driver: bridge

secrets:
  renderer_api_token:
    file: ${SIAB_RENDERER_API_TOKEN_FILE:?required}
  cloudflare_tunnel_token:
    file: ${CLOUDFLARE_TUNNEL_TOKEN_FILE:?required}
